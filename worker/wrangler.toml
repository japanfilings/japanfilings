name = "japanfilings-api"
main = "src/index.ts"
workers_dev = false  # the site is served only on japanstake.com (the zone's rate limit does not cover workers.dev)
compatibility_date = "2026-10-01"
# Static files (self-hosted fonts and their licences) are served before the Worker; static requests are free.
assets = { directory = "./public" }
routes = [{ pattern = "japanstake.com", custom_domain = true }, { pattern = "www.japanstake.com", custom_domain = true }]

# PUBLIC_ORIGIN (https://japanstake.com) is a Worker secret, so local dev and tests keep their own origin.

[[d1_databases]]
binding = "DB"
database_name = "japanfilings"
# Replace with the ID from `wrangler d1 create japanfilings` before deploying.
database_id = "1f42ad71-cb75-41f1-9c98-98912606efdd"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]  # webhook delivery
